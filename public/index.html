<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Basic Vercel React app with hello world functionality"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Drive Search</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Dropbox Integration -->
    <script>
    (function() {
        let dropboxAccessToken = null;
        let dropboxAppKey = '';
        const dbxIsLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);

        function generateCodeVerifier() {
            const array = new Uint8Array(64);
            crypto.getRandomValues(array);
            return btoa(String.fromCharCode(...array))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function fetchDropboxAppKey() {
            if (dbxIsLocalhost) {
                return localStorage.getItem('dropbox-app-key') || '';
            }
            try {
                const res = await fetch('/api/dropbox-key');
                const data = await res.json();
                return data.key || '';
            } catch {
                return '';
            }
        }

        window.getDropboxAccessToken = function() { return dropboxAccessToken; };

        window.dropboxDownloadFile = async function(path) {
            if (!dropboxAccessToken) return null;
            const response = await fetch('https://content.dropboxapi.com/2/files/download', {
                method: 'POST',
                headers: {
                    Authorization: 'Bearer ' + dropboxAccessToken,
                    'Dropbox-API-Arg': JSON.stringify({ path: path }),
                },
            });
            if (!response.ok) {
                if (response.status === 409) return null;
                throw new Error('Download failed');
            }
            return await response.text();
        };

        window.dropboxUploadFile = async function(path, content) {
            if (!dropboxAccessToken) throw new Error('Not signed into Dropbox');
            const response = await fetch('https://content.dropboxapi.com/2/files/upload', {
                method: 'POST',
                headers: {
                    Authorization: 'Bearer ' + dropboxAccessToken,
                    'Dropbox-API-Arg': JSON.stringify({
                        path: path, mode: { '.tag': 'overwrite' }, mute: true,
                    }),
                    'Content-Type': 'application/octet-stream',
                },
                body: content,
            });
            if (!response.ok) throw new Error('Upload failed');
            return true;
        };

        window.dropboxSignOut = async function() {
            if (dropboxAccessToken) {
                try {
                    await fetch('https://api.dropboxapi.com/2/auth/token/revoke', {
                        method: 'POST',
                        headers: { Authorization: 'Bearer ' + dropboxAccessToken },
                    });
                } catch {}
            }
            dropboxAccessToken = null;
        };

        // Popup-based sign-in: opens a small auth window, receives token via postMessage,
        // then calls onSuccess() so the caller can proceed immediately after auth.
        window.dropboxSignInPopup = async function(onSuccess) {
            let appKey;
            if (dbxIsLocalhost) {
                appKey = prompt('Enter your Dropbox App Key:');
                if (!appKey) return;
                localStorage.setItem('dropbox-app-key', appKey);
            } else {
                appKey = await fetchDropboxAppKey();
                if (!appKey) { alert('Dropbox App Key not configured on server'); return; }
            }
            dropboxAppKey = appKey;

            const verifier = generateCodeVerifier();
            const challenge = await generateCodeChallenge(verifier);
            localStorage.setItem('dropbox_code_verifier', verifier);

            const redirectUri = window.location.origin + window.location.pathname;
            const authUrl = 'https://www.dropbox.com/oauth2/authorize?client_id=' + appKey
                + '&response_type=code&code_challenge=' + challenge
                + '&code_challenge_method=S256&redirect_uri=' + encodeURIComponent(redirectUri)
                + '&token_access_type=online';

            const w = 600, h = 700;
            const left = Math.round(window.screenX + (window.outerWidth - w) / 2);
            const top = Math.round(window.screenY + (window.outerHeight - h) / 2);
            window.open(authUrl, 'dropbox-auth', `width=${w},height=${h},left=${left},top=${top}`);

            function handler(e) {
                if (e.origin !== window.location.origin) return;
                if (!e.data || e.data.type !== 'dropbox-token') return;
                dropboxAccessToken = e.data.token;
                window.removeEventListener('message', handler);
                if (onSuccess) onSuccess();
            }
            window.addEventListener('message', handler);
        };

        // Called on every page load. If we're the popup (has opener + code in URL),
        // exchange the code for a token, post it back to the parent, then close.
        // If we're the main page with a redirect code, handle normally (fallback).
        window._dropboxReady = (async function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (!code) return;

            const verifier = localStorage.getItem('dropbox_code_verifier');
            const appKey = await fetchDropboxAppKey();
            if (!verifier || !appKey) return;
            dropboxAppKey = appKey;

            const redirectUri = window.location.origin + window.location.pathname;
            const body = new URLSearchParams({
                code,
                grant_type: 'authorization_code',
                client_id: appKey,
                redirect_uri: redirectUri,
                code_verifier: verifier,
            });

            try {
                const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString(),
                });
                const data = await res.json();
                if (data.access_token) {
                    localStorage.removeItem('dropbox_code_verifier');
                    if (window.opener && !window.opener.closed) {
                        // We're the popup — send token to parent and close
                        window.opener.postMessage(
                            { type: 'dropbox-token', token: data.access_token },
                            window.location.origin
                        );
                        window.close();
                    } else {
                        // Fallback: redirect-based flow (not popup)
                        dropboxAccessToken = data.access_token;
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            } catch (err) {
                console.error('Dropbox auth error:', err);
                if (window.opener && !window.opener.closed) window.close();
            }
        })();
    })();
    </script>
  </body>
</html>
